---
name: Ansible role CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: python -m pip install ansible-core ansible-lint

      - name: Run production lint profile
        run: ansible-lint

      - name: Run syntax check
        run: ansible-playbook -i tests/inventory.yml tests/test.yml --syntax-check
